<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #190547;
            background-size: 3em 3em;
            background-image: radial-gradient(
                    transparent 1.25em,
                    #3b2a62 1.25em,
                    #3b2a62 1.5em,
                    transparent 1.5em
                ),
                radial-gradient(
                    transparent 1.25em,
                    #3b2a62 1.25em,
                    #3b2a62 1.5em,
                    transparent 1.5em
                );
            background-position: 0 0, 1.5em 1.5em;
            overflow: hidden;
        }
        .container {
            height: 100vh;
            width: 37.5em;
            position: absolute;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            overflow: hidden;
        }
        .wishes-container {
            width: 28.12em;
            height: 28.12em;
            background-color: #6031c0;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            top: calc(50% - 5.25em);
            left: calc(50% - 1.25em);
            box-shadow: 0 0 3.43em rgba(14, 2, 40, 0.7);
        }
        .lights {
            height: 1.25em;
            width: 1.25em;
            background-color: #432286;
            border-radius: 50%;
            position: absolute;
        }
        .lights-1 {
            left: 13.43em;
            top: 1.25em;
            box-shadow: 0 24.37em #432286, 11.87em 11.87em #432286,
                -11.87em 11.87em #432286;
            animation: lights1 2s infinite;
        }
        @keyframes lights1 {
            49% {
                background-color: #432286;
                box-shadow: 0 24.37em #432286, 11.87em 11.87em #432286,
                    -11.87em 11.87em #432286;
            }
            50% {
                background-color: #f4c631;
                box-shadow: 0 24.37em #f4c631, 11.87em 11.87em #f4c631,
                    -11.87em 11.87em #f4c631;
            }
            100% {
                background-color: #f4c631;
                box-shadow: 0 24.37em #f4c631, 11.87em 11.87em #f4c631,
                    -11.87em 11.87em #f4c631;
            }
        }
        .lights-2 {
            left: 5.31em;
            top: 5.31em;
            box-shadow: 16.25em 0 #432286, 0 16.25em #432286, 16.25em 16.25em #432286;
            animation: lights2 2s 1s infinite;
        }
        @keyframes lights2 {
            49% {
                background-color: #432286;
                box-shadow: 16.25em 0 #432286, 0 16.25em #432286, 16.25em 16.25em #432286;
            }
            50% {
                background-color: #f4c631;
                box-shadow: 16.25em 0 #f4c631, 0 16.25em #f4c631, 16.25em 16.25em #f4c631;
            }
            100% {
                background-color: #f4c631;
                box-shadow: 16.25em 0 #f4c631, 0 16.25em #f4c631, 16.25em 16.25em #f4c631;
            }
        }
        .wishes {
            height: 100%;
            width: 100%;
            font-family: "Courgette", cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #ffffff;
            font-size: 50px;
            line-height: 1.6em;
            animation: wishes 2s 3s forwards;
            transform: scale(0);
            transform-origin: 50% 50%;
        }

        @keyframes wishes {
            100% {
                transform: scale(1);
            }
        }
        .diya-container {
            height: 25em;
            width: 25em;
            position: absolute;
            transform: translate(-50%, -50%);
            top: calc(50% + 37.5em);
            left: calc(50% + 9.37em);
            animation: diya 3s forwards;
        }
        @keyframes diya {
            100% {
                top: calc(50% + 1.1em);
            }
        }
        .diya {
            height: 9.37em;
            width: 18.75em;
            background-color: #e53760;
            border-radius: 0 0 9.37em 9.37em;
            position: absolute;
            margin: auto;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            box-shadow: 0 0 2.18em rgba(14, 2, 40, 0.4);
        }
        .inside {
            width: 18.75em;
            height: 3.75em;
            background-color: #79182f;
            border-radius: 50%;
            position: absolute;
            margin: auto;
            left: 0;
            right: 0;
            bottom: 7.5em;
        }

        .flame {
            height: 10.62em;
            width: 10.62em;
            background-color: #fdf1c2;
            border-radius: 10em 0;
            transform: rotate(-45deg);
            position: absolute;
            margin: auto;
            left: 0;
            right: 0;
            bottom: 2.25em;
            animation: scale-up 2s infinite;
        }
        @keyframes scale-up {
            50% {
                transform: rotate(-45deg) scale(1.05);
                bottom: 2.62em;
            }
        }
        .flame:after {
            content: "";
            position: absolute;
            height: 7.5em;
            width: 7.5em;
            background-color: #f4c631;
            border-radius: 7.5em 0;
            position: absolute;
            bottom: 0;
        }
        .line-1,
        .line-2 {
            position: absolute;
            height: 3.75em;
            width: 20em;
            border: none;
            border-bottom: 0.5em solid #ffffff;
            border-radius: 50%;
            left: -0.62em;
        }
        .line-2 {
            top: 3.75em;
        }
        .dots {
            height: 3.75em;
            width: 20em;
            border: none;
            border-bottom: 0.62em dotted #f4c631;
            position: absolute;
            border-radius: 50%;
            top: 1.87em;
            left: -0.62em;
        }
        a {
            display: block;
            position: absolute;
            background-color: #ffffff;
            width: 100%;
            font-size: 1.8em;
            text-align: center;
            padding: 1em 0;
            border-radius: 0.5em;
            transform: translateY(-50%);
            top: calc(50% + 12em);
            color: #6031c0;
            text-decoration: none;
            font-family: "Poppins", sans-serif;
            font-weight: 600;
        }
        .fab {
            color: #ff0000;
        }
        @media screen and (max-width: 600px) {
            .container {
                font-size: 8.5px;
            }
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>
    <div class="container">
        <div class="wishes-container">
            <div class="lights lights-1"></div>
            <div class="lights lights-2"></div>
            <div class="wishes">
                <h3>Happy</h3>
                <h3>Diwali</h3>
            </div>
        </div>
        <div class="diya-container">
            <div class="diya">
                <div class="line-1"></div>
                <div class="line-2"></div>
                <div class="dots"></div>
            </div>
            <div class="inside">
                <div class="flame"></div>
            </div>
        </div>
    </div>
    
   <script type="module">
    import { tsParticles } from "https://cdn.jsdelivr.net/npm/@tsparticles/engine@3.1.0/+esm";
    import { loadAll } from "https://cdn.jsdelivr.net/npm/@tsparticles/all@3.1.0/+esm";

    async function loadParticles(options) {
        await loadAll(tsParticles);
        await tsParticles.load({ id: "tsparticles", options });
    }

    const configs = {
        name: "Fireworks Mask",
        fullScreen: {
            enable: true,
            zIndex: 0
        },
        background: {
            color: "#000000",
            image: "url('https://particles.js.org/images/background3.jpg')",
            position: "50% 50%",
            repeat: "no-repeat",
            size: "cover"
        },
        backgroundMask: {
            enable: true,
            cover: { color: "#000" }
        },
        emitters: {
            direction: "top",
            life: { count: 0, duration: 0.1, delay: 0.1 },
            rate: { delay: 0.15, quantity: 1 },
            size: { width: 100, height: 0 },
            position: { y: 100, x: 50 }
        },
        particles: {
            color: { value: "#fff" },
            number: { value: 0 },
            destroy: {
                bounds: { top: 30 },
                mode: "split",
                split: {
                    count: 1,
                    factor: { value: 0.333333 },
                    rate: { value: 100 },
                    particles: {
                        stroke: { width: 0 },
                        color: { value: ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93"] },
                        number: { value: 0 },
                        collisions: { enable: false },
                        destroy: { bounds: { top: 0 } },
                        opacity: {
                            value: { min: 0.1, max: 1 },
                            animation: {
                                enable: true,
                                speed: 0.7,
                                sync: false,
                                startValue: "max",
                                destroy: "min"
                            }
                        },
                        effect: {
                            type: "trail",
                            options: { trail: { length: { min: 5, max: 10 } } }
                        },
                        shape: { type: "circle" },
                        size: {
                            value: 2,
                            animation: { enable: false }
                        },
                        life: {
                            count: 1,
                            duration: { value: { min: 1, max: 2 } }
                        },
                        move: {
                            enable: true,
                            gravity: { enable: true, acceleration: 9.81, inverse: false },
                            decay: 0.1,
                            speed: { min: 10, max: 25 },
                            direction: "outside",
                            outModes: "destroy"
                        }
                    }
                }
            },
            life: { count: 1 },
            effect: {
                type: "trail",
                options: {
                    trail: {
                        length: { min: 10, max: 30 },
                        minWidth: 1,
                        maxWidth: 1
                    }
                }
            },
            rotate: { path: true },
            shape: { type: "circle" },
            size: { value: 1 },
            move: {
                enable: true,
                gravity: {
                    acceleration: 15,
                    enable: true,
                    inverse: true,
                    maxSpeed: 100
                },
                speed: { min: 10, max: 20 },
                outModes: { default: "destroy", top: "none" }
            }
        },
        sounds: {
            enable: true,
            mute: false, // 👈 ensures sound is NOT muted
            events: [
                {
                    event: "particleRemoved",
                    filter: (args) => args.data.particle.options.move.gravity.inverse,
                    audio: [
                        "https://particles.js.org/audio/explosion0.mp3",
                        "https://particles.js.org/audio/explosion1.mp3",
                        "https://particles.js.org/audio/explosion2.mp3"
                    ]
                }
            ],
            volume: 70 // slightly louder default
        }
    };

    loadParticles(configs);

    // 👇 1️⃣ Auto redirect after 10 seconds
    setTimeout(() => {
        window.location.href = "https://nhssairoli.newhorizonschools.org/"; // replace with your target site
    }, 10000); // 10 seconds (10000 ms)
</script>

</body>
</html>
